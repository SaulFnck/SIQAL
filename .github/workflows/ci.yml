name: CI/CD SIQAL Pipeline

on:
  push:
    branches: [ "dev", "qa", "main" ]
  pull_request:
    branches: [ "dev", "qa", "main" ]

jobs:
  backend_ci:
    name: Backend - Compilación y Pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BACKEND
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: BACKEND/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validación de tipos (Type Check)
        run: npx tsc --noEmit

      - name: Construir Backend
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}

  frontend_ci:
    name: Frontend - Compilación y Pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FRONTEND
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: FRONTEND/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Linter
        run: npm run lint

      - name: Construir Frontend
        run: npm run build

  deploy_qa:
    name: Despliegue en Entorno QA
    needs: [backend_ci, frontend_ci]
    if: github.ref == 'refs/heads/qa' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en QA
        run: echo "Simulando despliegue en QA..."

  deploy_prod:
    name: Despliegue en Entorno Producción
    needs: [backend_ci, frontend_ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Producción
        run: echo "Simulando despliegue final en Producción..."